<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Emmanuel Contact</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 420px;
            margin: 40px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 16px;
        }
        .label {
            color: #666;
            font-weight: 500;
        }
        .value {
            color: #222;
            font-weight: 600;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #218838;
        }
        button:active {
            transform: scale(0.98);
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Save Contact</h2>
        <p class="subtitle">Tap the button below to download the contact</p>

        <div class="info">
            <div class="info-row">
                <span class="label">Name</span>
                <span class="value">Emmanuel</span>
            </div>
            <div class="info-row">
                <span class="label">Phone</span>
                <span class="value">8158331002</span>
            </div>
        </div>

        <button onclick="saveContact()">Save to Contacts</button>

        <div class="note">
            After downloading, open the <strong>Emmanuel.vcf</strong> file on your phone.<br>
            Your phone will ask if you want to add it to Contacts.
        </div>
    </div>

    <script>
        function saveContact() {
            const name = "Emmanuel";
            const number = "8158331002";

            // Create vCard content
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${name}
N:${name};;;
TEL;TYPE=CELL:${number}
END:VCARD`;

            // Create downloadable file
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "Emmanuel.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
